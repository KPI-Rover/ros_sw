# PC side: simulation, RViz and building the workspace. Usually started by ./rover.sh, which sets
# the variables below. The robot side is in scripts/rpi-setup/docker-compose.yaml.
name: kpi-rover

services:
  pc:
    image: ghcr.io/kpi-rover/pc:${TAG:-main}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: pc
    network_mode: host
    ipc: host
    privileged: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # GPU access for Gazebo and RViz: without these groups rendering falls back to the CPU (llvmpipe)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-110}"
      - dialout
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_STATIC_PEERS=${ROS_STATIC_PEERS:-}
      - HOME=/workspace/.docker_home
      - XDG_CACHE_HOME=/workspace/.docker_home/.cache
      - XDG_DATA_HOME=/workspace/.docker_home/.local
      - XDG_CONFIG_HOME=/workspace/.docker_home/.config
      - ZELLIJ_CONFIG_DIR=/workspace/.zellij
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    working_dir: /workspace
    tty: true
    stdin_open: true

  # The same with an NVIDIA GPU (needs the nvidia runtime of nvidia-container-toolkit on the host)
  pc-nvidia:
    extends: pc
    profiles: [nvidia]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

  # The same on Windows (WSL2 with WSLg). The GPU of Windows is reached through /dev/dxg and Mesa's d3d12 driver,
  # for any vendor (NVIDIA, AMD, Intel); the GPU libraries come from Windows in /usr/lib/wsl/lib. No
  # nvidia-container-toolkit is needed for rendering.
  pc-wsl:
    extends: pc
    profiles: [wsl]
    environment:
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      # Several GPUs (e.g. a laptop with Intel + NVIDIA): pick one by a part of its name, e.g. NVIDIA
      # (passed only when set on the host)
      - MESA_D3D12_DEFAULT_ADAPTER_NAME
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /mnt/wslg:/mnt/wslg
    devices:
      - /dev/dxg:/dev/dxg
