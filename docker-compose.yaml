# PC side: simulation, RViz and building the workspace. Usually started by ./rover.sh, which sets
# the variables below. The robot side is in rpi/docker-compose.yaml.
name: kpi-rover

services:
  pc:
    image: ghcr.io/kpi-rover/pc:${TAG:-main}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: pc
    network_mode: host
    ipc: host
    privileged: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # GPU access for Gazebo and RViz: without these groups rendering falls back to the CPU (llvmpipe)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-110}"
      - dialout
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_STATIC_PEERS=${ROS_STATIC_PEERS:-}
      - HOME=/workspace/.docker_home
      - XDG_CACHE_HOME=/workspace/.docker_home/.cache
      - XDG_DATA_HOME=/workspace/.docker_home/.local
      - XDG_CONFIG_HOME=/workspace/.docker_home/.config
      - ZELLIJ_CONFIG_DIR=/workspace/.zellij
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    working_dir: /workspace
    tty: true
    stdin_open: true

  # The same with an NVIDIA GPU (needs the nvidia runtime of nvidia-container-toolkit on the host)
  pc-nvidia:
    extends: pc
    profiles: [nvidia]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
