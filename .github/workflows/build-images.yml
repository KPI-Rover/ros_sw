# Builds the Docker images (see docker/Dockerfile) and publishes them to ghcr.io/kpi-rover.
#   push to main          -> tags `main` and `sha-<commit>`
#   Run workflow (Actions) -> tags `<branch>` and `sha-<commit>`, for testing a branch on a robot
#   pull request          -> build only, nothing is published
name: Build images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/kpi-rover
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  pc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/pc
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: pc
          platforms: linux/amd64
          push: ${{ env.PUSH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/pc:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/pc:buildcache,mode=max', env.REGISTRY) || '' }}

  robot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-robot
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/robot
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: robot
          platforms: linux/arm64
          push: ${{ env.PUSH }}
          tags: ${{ steps.meta-robot.outputs.tags }}
          labels: ${{ steps.meta-robot.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/robot:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/robot:buildcache,mode=max', env.REGISTRY) || '' }}
